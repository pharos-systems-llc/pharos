# * Purpose (The "Why"):
# This is the Cargo configuration for the 'pharos-server' backend.
# * Traceability:
# Related to Task 2.1
# ========================================================================

[package]
name = "pharos-server"
version = "0.1.0"
edition = "2024"

[dependencies]
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
futures = "0.3"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ldap3 = "0.11"
ssh-key = { version = "0.6", features = ["ed25519"] }
signature = "2.2"
base64 = "0.22"
hex = "0.4"
rand = "0.8"
prometheus = { version = "0.13", default-features = false, features = ["process"] }
lazy_static = "1.4"
sysinfo = "0.33"
warp = "0.3"
tokio-rustls = "0.26"
rustls-pki-types = "1.15"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
pharos-client = { path = "../crates/pharos-client" }

[dev-dependencies]
tempfile = "3"
ed25519-dalek = "2.2"
# Pure-Rust self-signed cert generation for the TLS-flush regression test
# (flush_on_large_query_response.rs) - avoids depending on the host/CI
# container having an `openssl` CLI binary installed, unlike gen-sandbox-certs.sh.
rcgen = "0.13"
