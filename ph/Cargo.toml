# * Purpose (The "Why"):
# This is the Cargo configuration for the 'ph' CLI client.
# * Traceability:
# Related to Task 3.1
# ========================================================================

[package]
name = "ph"
version = "1.12.4"
edition = "2024"

[dependencies]
pharos-client = { path = "../crates/pharos-client" }
pharos-cli-support = { path = "../crates/pharos-cli-support" }
tokio = { version = "1.37", features = ["full"] }
anyhow = "1.0"
log = "0.4"
clap = { version = "4.5", features = ["derive"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-log = "0.2"


